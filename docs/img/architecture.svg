<svg xmlns="http://www.w3.org/2000/svg" width="900" height="545" viewBox="0 0 900 545" font-family="Helvetica, Arial, sans-serif">
<rect width="900" height="545" fill="#ffffff"/>
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#555"/></marker><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c9302c"/></marker></defs>
<text x="20.0" y="30.0" font-size="18" fill="#222" text-anchor="start" font-weight="bold">ublk-disksim: a real block device with the timing of a modelled disk</text>
<text x="20.0" y="51.0" font-size="12" fill="#555" text-anchor="start">Each request gets two independent actions: its data goes to a RAM backing device at once, and a timing model</text>
<text x="20.0" y="67.0" font-size="12" fill="#555" text-anchor="start">decides when it completes. Software on top works as on RAM and sees the latency and queueing of the model.</text>
<rect x="20" y="100" width="250" height="52" rx="6" fill="#fdf1e3" stroke="#e8912d" stroke-width="1.5"/>
<text x="145.0" y="117.0" font-size="12" fill="#222" text-anchor="middle" font-weight="bold">application / file system / Ceph</text>
<text x="145.0" y="133.0" font-size="11" fill="#444" text-anchor="middle">reads, writes, flushes</text>
<rect x="20" y="185" width="250" height="58" rx="6" fill="#f4f4f4" stroke="#888" stroke-width="1.5"/>
<text x="145.0" y="202.0" font-size="12" fill="#222" text-anchor="middle" font-weight="bold">/dev/ublkbN</text>
<text x="145.0" y="218.0" font-size="11" fill="#444" text-anchor="middle">rotational, write cache on/off</text>
<text x="145.0" y="232.0" font-size="11" fill="#444" text-anchor="middle">as the model advertises</text>
<rect x="20" y="276" width="250" height="58" rx="6" fill="#f4f4f4" stroke="#888" stroke-width="1.5"/>
<text x="145.0" y="293.0" font-size="12" fill="#222" text-anchor="middle" font-weight="bold">ublk_drv (kernel)</text>
<text x="145.0" y="309.0" font-size="11" fill="#444" text-anchor="middle">request descriptors in shared</text>
<text x="145.0" y="323.0" font-size="11" fill="#444" text-anchor="middle">memory, commands over io_uring</text>
<polyline points="145,152 145,183" fill="none" stroke="#555" stroke-width="1.6" marker-end="url(#ar)"/>
<polyline points="145,243 145,274" fill="none" stroke="#555" stroke-width="1.6" marker-end="url(#ar)"/>
<rect x="330" y="95" width="550" height="325" rx="8" fill="#fafafa" stroke="#2b7bba" stroke-width="1.5" stroke-dasharray="6,4"/>
<text x="345.0" y="115.0" font-size="12.5" fill="#2b7bba" text-anchor="start" font-weight="bold">kublk server: one thread per device (user space)</text>
<polyline points="270,296 348,296" fill="none" stroke="#555" stroke-width="1.6" marker-end="url(#ar)"/>
<text x="300.0" y="288.0" font-size="9.5" fill="#555" text-anchor="middle">fetch</text>
<rect x="350" y="128" width="230" height="58" rx="6" fill="#eef4fa" stroke="#2b7bba" stroke-width="1.5"/>
<text x="465.0" y="145.0" font-size="12" fill="#222" text-anchor="middle" font-weight="bold">target: hdd.c / ssd.c</text>
<text x="465.0" y="161.0" font-size="11" fill="#444" text-anchor="middle">options, profiles, attributes</text>
<polyline points="465,186 465,213" fill="none" stroke="#555" stroke-width="1.6" marker-end="url(#ar)"/>
<rect x="350" y="215" width="230" height="100" rx="6" fill="#eef4fa" stroke="#2b7bba" stroke-width="1.5"/>
<text x="465.0" y="232.0" font-size="12" fill="#222" text-anchor="middle" font-weight="bold">glue: model_kublk.c</text>
<text x="465.0" y="248.0" font-size="11" fill="#444" text-anchor="middle">data I/O to the backing device</text>
<text x="465.0" y="262.0" font-size="11" fill="#444" text-anchor="middle">completion timer per request</text>
<text x="465.0" y="276.0" font-size="11" fill="#444" text-anchor="middle">wake-up timers, stats file,</text>
<text x="465.0" y="290.0" font-size="11" fill="#444" text-anchor="middle">lateness record</text>
<rect x="660" y="215" width="200" height="100" rx="6" fill="#eaf5ea" stroke="#3d8b3d" stroke-width="1.5"/>
<text x="760.0" y="232.0" font-size="12" fill="#222" text-anchor="middle" font-weight="bold">timing model</text>
<text x="760.0" y="248.0" font-size="11" fill="#444" text-anchor="middle">hdd_model.c / ssd_model.c</text>
<text x="760.0" y="262.0" font-size="11" fill="#444" text-anchor="middle">time only: when does</text>
<text x="760.0" y="276.0" font-size="11" fill="#444" text-anchor="middle">each request complete?</text>
<text x="760.0" y="290.0" font-size="11" fill="#444" text-anchor="middle">no clock, no I/O of its own</text>
<polyline points="580,250 658,250" fill="none" stroke="#555" stroke-width="1.6" marker-end="url(#ar)"/>
<text x="619.0" y="243.0" font-size="9.5" fill="#555" text-anchor="middle">submit, wake</text>
<polyline points="658,285 582,285" fill="none" stroke="#3d8b3d" stroke-width="1.6" marker-end="url(#ar)"/>
<text x="619.0" y="302.0" font-size="9.5" fill="#3d8b3d" text-anchor="middle">done(tag, t)</text>
<text x="619.0" y="314.0" font-size="9.5" fill="#3d8b3d" text-anchor="middle">wake(t)</text>
<rect x="350" y="340" width="230" height="60" rx="6" fill="#f4f4f4" stroke="#888" stroke-width="1.5"/>
<text x="465.0" y="357.0" font-size="12" fill="#222" text-anchor="middle" font-weight="bold">io_uring</text>
<text x="465.0" y="373.0" font-size="11" fill="#444" text-anchor="middle">READ / WRITE to the backing fd</text>
<text x="465.0" y="387.0" font-size="11" fill="#444" text-anchor="middle">TIMEOUT at an absolute time</text>
<polyline points="465,315 465,338" fill="none" stroke="#555" stroke-width="1.6" marker-end="url(#ar)"/>
<rect x="660" y="340" width="200" height="60" rx="6" fill="#fff" stroke="#aaa" stroke-width="1.5"/>
<text x="760.0" y="357.0" font-size="12" fill="#222" text-anchor="middle" font-weight="bold">backing device</text>
<text x="760.0" y="373.0" font-size="11" fill="#444" text-anchor="middle">memory-backed null_blk or brd</text>
<text x="760.0" y="387.0" font-size="11" fill="#444" text-anchor="middle">(data is never delayed)</text>
<polyline points="580,370 658,370" fill="none" stroke="#555" stroke-width="1.6" marker-end="url(#ar)"/>
<polyline points="350,380 300,380 300,318 272,318" fill="none" stroke="#555" stroke-width="1.6" marker-end="url(#ar)"/>
<text x="300.0" y="437.0" font-size="10" fill="#555" text-anchor="start">commit when the data is done AND the timer fired</text>
<polyline points="298,430 298,384" fill="none" stroke="#555" stroke-width="1" marker-end="url(#ar)" stroke-dasharray="5,3"/>
<text x="20.0" y="470.0" font-size="11" fill="#333" text-anchor="start" font-weight="bold">Models</text>
<text x="20.0" y="486.0" font-size="11" fill="#333" text-anchor="start">hdd: one actuator (seek curve + rotation from sector angle and platter phase), NCQ reordering, volatile write cache with</text>
<text x="20.0" y="502.0" font-size="11" fill="#333" text-anchor="start">write-back, non-queued FLUSH that blocks everything behind it; profiles fitted to a spec sheet or a measured drive.</text>
<text x="20.0" y="518.0" font-size="11" fill="#333" text-anchor="start">ssd: dies, host link, write buffer, with or without power-loss protection. Both tested on a virtual clock (make check).</text>
</svg>