   <g id="text_19">
    <text style="font-weight: 700; font-size: 10px; font-family: 'Helvetica Neue', 'Helvetica', 'Arial', 'DejaVu Sans', sans-serif; fill: #d9480f" transform="translate(509.837946 207.399958)">ST2000DM006 (real drive)</text>
