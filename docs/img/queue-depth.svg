  <g id="text_21">
   <text style="font-weight: 700; font-size: 15px; font-family: 'Helvetica Neue', 'Helvetica', 'Arial', 'DejaVu Sans', sans-serif; text-anchor: start; fill: #1d2327" x="8.64" y="21.00041" transform="rotate(-0 8.64 21.00041)">Queueing pays off on an enterprise disk, barely on a consumer one</text>
  </g>
  <g id="text_22">
   <text style="font-size: 10.5px; font-family: 'Helvetica Neue', 'Helvetica', 'Arial', 'DejaVu Sans', sans-serif; fill: #5f6b73" transform="translate(8.64 47.057959)">A drive that reorders its queue (NCQ) serves the nearest request next. hgst-7k8 assumes it does that well;</text>
   <text style="font-size: 10.5px; font-family: 'Helvetica Neue', 'Helvetica', 'Arial', 'DejaVu Sans', sans-serif; fill: #5f6b73" transform="translate(8.64 60.850283)">barracuda-2t is fitted to a real ST2000DM006 (dashed), which gains little from a deep queue.</text>
  </g>
