<svg xmlns="http://www.w3.org/2000/svg" width="900" height="580" viewBox="0 0 900 580" font-family="Helvetica, Arial, sans-serif">
<rect width="900" height="580" fill="#ffffff"/>
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#555"/></marker><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c9302c"/></marker></defs>
<text x="20.0" y="30.0" font-size="18" fill="#222" text-anchor="start" font-weight="bold">Inside the hdd model: one actuator, a queue, a write cache, a blocking flush</text>
<text x="20.0" y="51.0" font-size="12" fill="#555" text-anchor="start">Everything the actuator does is on one timeline: an operation starts when the actuator is free or its request arrives,</text>
<text x="20.0" y="67.0" font-size="12" fill="#555" text-anchor="start">whichever is later. Parameters in brackets (profiles hgst-7k8 / barracuda-2t).</text>
<rect x="20" y="110" width="130" height="28" rx="6" fill="#fdf1e3" stroke="#e8912d" stroke-width="1.5"/>
<text x="85.0" y="127.0" font-size="12" fill="#222" text-anchor="middle" font-weight="bold">reads</text>
<rect x="20" y="200" width="130" height="28" rx="6" fill="#fdf1e3" stroke="#e8912d" stroke-width="1.5"/>
<text x="85.0" y="217.0" font-size="12" fill="#222" text-anchor="middle" font-weight="bold">writes</text>
<rect x="20" y="364" width="130" height="28" rx="6" fill="#fbeaea" stroke="#c9302c" stroke-width="1.5"/>
<text x="85.0" y="381.0" font-size="12" fill="#222" text-anchor="middle" font-weight="bold">FLUSH</text>
<rect x="230" y="90" width="250" height="90" rx="6" fill="#eef4fa" stroke="#2b7bba" stroke-width="1.5"/>
<text x="355.0" y="107.0" font-size="12" fill="#222" text-anchor="middle" font-weight="bold">queue (arrival order)</text>
<text x="355.0" y="123.0" font-size="10.5" fill="#444" text-anchor="middle">reads, and writes when the cache</text>
<text x="355.0" y="137.0" font-size="10.5" fill="#444" text-anchor="middle">is off; next = earliest start among</text>
<text x="355.0" y="151.0" font-size="10.5" fill="#444" text-anchor="middle">the oldest [ncq 32 / 4]; a request</text>
<text x="355.0" y="165.0" font-size="10.5" fill="#444" text-anchor="middle">passed over [500 ms] goes first</text>
<polyline points="150,124 228,124" fill="none" stroke="#555" stroke-width="1.6" marker-end="url(#ar)"/>
<rect x="230" y="200" width="250" height="110" rx="6" fill="#eaf5ea" stroke="#3d8b3d" stroke-width="1.5"/>
<text x="355.0" y="217.0" font-size="12" fill="#222" text-anchor="middle" font-weight="bold">write cache [64 / 1 MiB]</text>
<text x="355.0" y="233.0" font-size="10.5" fill="#444" text-anchor="middle">write done after the host transfer</text>
<text x="355.0" y="247.0" font-size="10.5" fill="#444" text-anchor="middle">dirty extents, sorted by LBA, merged</text>
<text x="355.0" y="261.0" font-size="10.5" fill="#444" text-anchor="middle">write-back: earliest start over the</text>
<text x="355.0" y="275.0" font-size="10.5" fill="#444" text-anchor="middle">whole set, or the oldest [– / 8];</text>
<text x="355.0" y="289.0" font-size="10.5" fill="#444" text-anchor="middle">≤ one track per operation</text>
<polyline points="150,214 228,214" fill="none" stroke="#555" stroke-width="1.6" marker-end="url(#ar)"/>
<text x="189.0" y="208.0" font-size="9.5" fill="#555" text-anchor="middle">cache on</text>
<polyline points="170,200 170,160 228,160" fill="none" stroke="#555" stroke-width="1.1" marker-end="url(#ar)" stroke-dasharray="5,3"/>
<text x="174.0" y="154.0" font-size="9.5" fill="#555" text-anchor="start">cache off</text>
<rect x="540" y="110" width="330" height="120" rx="6" fill="#f4f4f4" stroke="#222" stroke-width="1.5"/>
<text x="705.0" y="127.0" font-size="12" fill="#222" text-anchor="middle" font-weight="bold">actuator (one)</text>
<text x="555.0" y="150.0" font-size="10.5" fill="#333" text-anchor="start">position = seek(√distance, none within a track)</text>
<text x="555.0" y="165.5" font-size="10.5" fill="#333" text-anchor="start">  + wait for the sector to come round</text>
<text x="555.0" y="181.0" font-size="10.5" fill="#333" text-anchor="start">  (angle from LBA, phase from the clock)</text>
<text x="555.0" y="196.5" font-size="10.5" fill="#333" text-anchor="start">then transfer at the media rate; continuing</text>
<text x="555.0" y="212.0" font-size="10.5" fill="#333" text-anchor="start">where the head is costs nothing</text>
<polyline points="480,135 538,150" fill="none" stroke="#555" stroke-width="1.6" marker-end="url(#ar)"/>
<text x="509.0" y="132.0" font-size="10" fill="#555" text-anchor="middle">serve</text>
<polyline points="480,255 538,205" fill="none" stroke="#555" stroke-width="1.6" marker-end="url(#ar)"/>
<text x="492.0" y="200.0" font-size="10" fill="#555" text-anchor="start">write back</text>
<text x="540.0" y="262.0" font-size="10.5" fill="#555" text-anchor="start">Write-back runs when nothing is queued; once the</text>
<text x="540.0" y="277.5" font-size="10.5" fill="#555" text-anchor="start">cache is 3/4 full or writes wait for space, also</text>
<text x="540.0" y="293.0" font-size="10.5" fill="#555" text-anchor="start">one per request served.</text>
<rect x="230" y="340" width="250" height="78" rx="6" fill="#fbeaea" stroke="#c9302c" stroke-width="1.5"/>
<text x="355.0" y="357.0" font-size="12" fill="#222" text-anchor="middle" font-weight="bold">FLUSH (SATA FLUSH CACHE)</text>
<text x="355.0" y="373.0" font-size="10.5" fill="#444" text-anchor="middle">non-queued: queued requests finish,</text>
<text x="355.0" y="387.0" font-size="10.5" fill="#444" text-anchor="middle">the whole cache is written back,</text>
<text x="355.0" y="401.0" font-size="10.5" fill="#444" text-anchor="middle">later arrivals (reads too) are held</text>
<polyline points="150,378 228,378" fill="none" stroke="#c9302c" stroke-width="1.6" marker-end="url(#arr)"/>
<polyline points="480,379 860,379 860,232" fill="none" stroke="#c9302c" stroke-width="1.6" marker-end="url(#arr)"/>
<text x="670.0" y="372.0" font-size="10" fill="#c9302c" text-anchor="middle">drains the whole cache through the actuator</text>
<rect x="20" y="450" width="860" height="110" fill="#f7f7f7"/>
<text x="35.0" y="472.0" font-size="11" fill="#333" text-anchor="start" font-weight="bold">What that gives (calibrate.sh, hgst-7k8 / barracuda-2t)</text>
<text x="35.0" y="488.0" font-size="11" fill="#333" text-anchor="start">random 4K read: 12.5 / 17.3 ms at QD1, 207 / 82 IOPS at QD32; sequential read 186 / 139 MB/s</text>
<text x="35.0" y="504.0" font-size="11" fill="#333" text-anchor="start">flush after 1 / 8 / 64 scattered cached 4K writes: 12 / 73 / 335 ms and 18 / 103 / 656 ms (measured drive, via NTFS: 37 / 127 / 630)</text>
<text x="35.0" y="520.0" font-size="11" fill="#333" text-anchor="start">cache off (--cache_mb 0): no flushes reach the device; each write pays seek and rotation, and sequential writes at QD1</text>
<text x="35.0" y="536.0" font-size="11" fill="#333" text-anchor="start">lose a revolution each (78 vs 205 MB/s with hgst-7k8)</text>
</svg>